# Type-checks and builds the docs site on every PR into devel and every push to devel.
name: CI

on:
  pull_request:
    branches: [devel]
  push:
    branches: [devel]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc --noEmit, then vite build.
      - run: npm run build
